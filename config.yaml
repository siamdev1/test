# API কন্ট্রোল করার মূল সেটিংস
external-controller: 127.0.0.1:9090
secret: "123456"

# বেসিক কনফিগ (যাতে ক্ল্যাশ চালু হয়)
proxies:
  - name: "Direct-Local"
    type: socks5
    server: 127.0.0.1
    port: 1080
proxy-groups:
  - name: "Proxy"
    type: select
    proxies:
      - "Direct-Local"
rules:
  - MATCH,DIRECT